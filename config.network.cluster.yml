# Cluster (Linux) configuration for the network-level study.
#
# Identical to config.network.yml except that every path is the Linux form of
# the same SCISTOR storage: S:\ on Windows is /scistor/ivm on the cluster, so
# "S:/yma794/..." becomes "/scistor/ivm/yma794/...".
#
# Because the Energy Model drop lives inside this repo (on the shared drive),
# the cluster sees it at the same relative path with no copying.
#
# Select it with MIRACA_NET_CONFIG; submit_network_study.sh exports it for you:
#   export MIRACA_NET_CONFIG=/scistor/ivm/$USER/Power-Network-Uncertainty/config.network.cluster.yml

country: LUX
asset_type: power

# --- Stage 1 output from the direct-damage study ------------------------------
# NOT recomputed here. This must point at the intermediate/ folder of the
# Uncertainty-Modelling clone that ran Stage 1 for the `power` asset.
# Override with NET_INTERMEDIATE_DIR if your clone lives elsewhere.
intermediate_dir: "/scistor/ivm/yma794/Uncertainty-Modelling/data/intermediate"
results_dir: "results"
cache_dir: "cache"

# Relative to the repo root, so it resolves on both platforms.
energy_model_dir: "Energy Model"

# V3.0.0 - see config.network.yml. Relative to the repo so it resolves on both
# sides: the workbook lives in the Energy Model drop, which is synced with the
# repo rather than living in eks510's space.
vulnerability_path: "Energy Model/Table_D2_Multi-Hazard_Fragility_and_Vulnerability_Curves_V3.0.0_AUTH.xlsx"
fragility_path: "/scistor/ivm/eks510/projects/AssetRisk_PanEU/data/EQ_fragility.xlsx"
basin_data_path: "/scistor/ivm/eks510/projects/AssetRisk_PanEU/data/basins_abs_shift_return_periods.parquet"

network:
  reference_timestamp: "2018-01-24T17:00:00Z"
  timing_archetype: winter_peak
  voll_eur_mwh: 10000.0
  outage_window_hours: 24.0
  unmatched_bus_policy: immune
  snap_max_m: 25000.0
  intensity_aggregation: max
  # equal | nuts3 | nuts3_pop | nuts3_gdp - see config.network.yml for what
  # each does and which countries fall back to the equal split.
  event_footprint: basin_lev07
  load_disaggregation: nuts3
  nuts3_year: 2021
  nuts3_gdp_weight: 0.5
  # See config.network.yml for what each of these does and the measurements
  # behind the defaults. All four changed on 2026-09-16, and together they make
  # the base case a physically possible operating point for the first time:
  # the DC layer is read, converter terminals no longer receive national demand,
  # the OPF is solved as an LP with HiGHS, and line ratings are enforced.
  # Results from before that date are NOT comparable - the structural floor was
  # 3,522 MW of phantom load on unconnected HVDC terminals and is now 0.
  include_hvdc: true
  exclude_dc_terminal_load: true
  opf_backend: highs
  dispatch_objective: economic
  # On. The 12.9% of lines over 100% that previously blocked this was neither
  # the load disaggregation nor the missing HVDC - both were tested and cleared
  # - but the unconstrained economic dispatch itself. PIPS could not converge
  # with limits; HiGHS does, in seconds.
  thermal_limits: true
  # AL, BA, MD, MK, XK have no OPSD demand series, so their 85 buses carry zero
  # load but keep 11.53 GW of generation - in the base case they dispatch
  # 6.7 GW with nothing to serve, making Bosnia the 4th largest exporter in the
  # model. `keep_generation` leaves that alone (the honest picture of the input
  # data); `neutral` also switches their generation off, so they are pure
  # transit. EAENS is insensitive either way (<0.03%, both signs - see
  # `_apply_zero_load_policy`), because ENS is a difference of two solves that
  # both contain the artefact and the residual shed is delivery-limited.
  zero_load_country_policy: keep_generation
